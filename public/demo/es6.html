<!DOCTYPE html>
<div id="root"></div>

<script type="module">
import { selo } from '../index.js';


const APP = `
// ── MODEL ──
const counter = Behaviors.collect(0, click, (prev, _) => prev + 1);

// ── VIEW ───
const click = Events.listener(rootEl.querySelector('#btn'), 'click', () => 1);

const _render = (()=>{
   rootEl.querySelector('#count').textContent = counter;
})();
`;

const buildUI = (rootEl, label) => {
    rootEl.innerHTML = `
        <div>${label}</div>
        <div id="count">0</div>
        <button id="btn">Click me</button>
    `;
};

selo({
    app:        APP,
    modelNodes: ['counter'],
    seloId:     'my-app',
    reflector:  'ws://localhost:3000',
    rootEl:     document.getElementById('root'),
    buildUI,
});
</script>
