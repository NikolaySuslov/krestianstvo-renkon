<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Krestianify — Counter + Timer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #111; font-family: monospace; }
#stage { width: 100%; height: 100dvh; display: flex; flex-direction: column; }
#header {
  flex: 0 0 auto; padding: 8px 16px;
  background: #1a1a2e; color: #aef; font-size: 13px;
  border-bottom: 1px solid #333;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
#header h1 { color: #cdf; }
.hint { font-size: 11px; color: #556; }
#vms { flex: 1; display: flex; min-height: 0; }
.vm-pane { flex: 1; border-right: 1px solid #333; position: relative; overflow: hidden; }
.vm-pane:last-child { border-right: none; }
.vm-root {
  position: absolute; inset: 0; background: #f5f5f8;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 20px; padding: 24px;
}
</style>
</head>
<body>
<div id="stage">
  <div id="header">
    <h1>Krestianify — Counter + Timer</h1>
    <span class="hint">+/− click → shared counter</span>
    <span class="hint">Start/Stop → +1/s · 9 subticks/s · all via <code>future()</code> in model</span>
    <span class="hint" style="margin-left:auto">Two peers · same reflector</span>
  </div>
  <div id="vms">
    <div class="vm-pane"><div id="vmA-root" class="vm-root"></div></div>
    <div class="vm-pane"><div id="vmB-root" class="vm-root"></div></div>
  </div>
</div>

<script type="module">
import { selo } from '../index.js';


// ═══════════════════════════════════════════════════════════════════════════
// THE APP — one Renkon program, model/view split by MODEL_NODES.
//
// The timer lives entirely in the model as a future()-based self-chaining
// tick — same pattern as the balls demo. No view sends, no APPLY_ACTION,
// no manual WebSocket calls. Each tick fires at the same virtual time on
// all peers → fully deterministic.
// ═══════════════════════════════════════════════════════════════════════════

const APP = `
// ── MODEL ──────────────────────────────────────────────────────────────────

// running — toggled by start/stop button, starts false
const running = Behaviors.collect(false, toggle, (prev, _) => {
    var next = !prev;
    if (next) future(now(), 1000, '_tick', { type: '_tick' });
    return next;
});

// _tick — fires every 1s, schedules 9 subticks at 100ms intervals within the second
const _tick    = Events.receiver();
const _subTick = Events.receiver();

const _tickLoop = Behaviors.collect(null, _tick, (_, __) => {
    if (!running) return null;
    future(now(), 1000, '_tick', { type: '_tick' });
    for (var i = 1; i <= 9; i++) future(now(), i * 100, '_subTick', { step: i });
    return null;
});

// counter increments on each main tick
const counter = Behaviors.collect(0, Events.or(incr, decr, _tick), (prev, ev) => {
    if (ev && ev.type === '_tick') return prev + 1;
    return prev + ev;
});

// subCounter increments on each subtick (9x per second when running)
const subCounter = Behaviors.collect(0, _subTick, (prev, _) => prev + 1);

// ── VIEW ────────────────────────────────────────────────────────────────────

const incr   = Events.listener(Renkon.app.rootEl.querySelector('#incr'),   'click', () => 1);
const decr   = Events.listener(Renkon.app.rootEl.querySelector('#decr'),   'click', () => -1);
const toggle = Events.listener(Renkon.app.rootEl.querySelector('#toggle'), 'click', () => 1);

const _render = Behaviors.collect(null,
    Events.or(Events.change($counter), Events.change($subCounter), Events.change($running)),
    (_, __) => {
        var countEl  = Renkon.app.rootEl.querySelector('#count');
        var subEl    = Renkon.app.rootEl.querySelector('#subcounter');
        var toggleEl = Renkon.app.rootEl.querySelector('#toggle');
        if (countEl)  countEl.textContent  = counter;
        if (subEl)    subEl.textContent    = 'sub: ' + subCounter;
        if (toggleEl) toggleEl.textContent = running ? 'Stop' : 'Start';
        return null;
    }
);
`;

const MODEL_NODES = ['counter', 'subCounter', 'running', '_tick', '_subTick', '_tickLoop'];

// ─────────────────────────────────────────────────────────────────────────
// Boot
// ─────────────────────────────────────────────────────────────────────────

const buildUI = (rootEl, label) => {
    rootEl.innerHTML = `
        <div style="font-size:11px;color:#889;letter-spacing:1px">${label}</div>
        <div id="count" style="font-size:72px;font-weight:bold;color:#223;letter-spacing:-2px">0</div>
        <div id="subcounter" style="font-size:13px;color:#88a;margin-top:-8px">sub: 0</div>
        <div style="display:flex;gap:12px;margin-top:8px">
            <button id="incr"   style="font-size:28px;width:60px;height:60px;border-radius:10px;border:2px solid #aab;background:#fff;cursor:pointer">+</button>
            <button id="decr"   style="font-size:28px;width:60px;height:60px;border-radius:10px;border:2px solid #aab;background:#fff;cursor:pointer">−</button>
            <button id="toggle" style="font-size:16px;width:80px;height:60px;border-radius:10px;border:2px solid #88b;background:#eef;cursor:pointer">Start</button>
        </div>
        <div style="font-size:11px;color:#aab">+1/s · 9 subticks/s · press Start</div>
    `;
};

selo({ app: APP, modelNodes: MODEL_NODES, seloId: 'kfy-timer', reflector: 'ws://localhost:3000',
           rootEl: document.getElementById('vmA-root'), label: 'peer A', delay: 0,   buildUI });
selo({ app: APP, modelNodes: MODEL_NODES, seloId: 'kfy-timer', reflector: 'ws://localhost:3000',
           rootEl: document.getElementById('vmB-root'), label: 'peer B', delay: 350, buildUI });
</script>
</body>
</html>
