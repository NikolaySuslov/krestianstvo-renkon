<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Krestianify — Color Demo</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #111; font-family: monospace; }
#stage { width: 100%; height: 100dvh; display: flex; flex-direction: column; }
#header {
  flex: 0 0 auto;
  padding: 8px 16px;
  background: #1a1a2e;
  color: #aef;
  font-size: 13px;
  border-bottom: 1px solid #333;
  display: flex; align-items: center; gap: 16px;
}
#header h1 { color: #cdf; }
.hint { font-size: 11px; color: #556; }
#vms { flex: 1; display: flex; min-height: 0; }
.vm-pane {
  flex: 1;
  border-right: 1px solid #333;
  position: relative;
  overflow: hidden;
}
.vm-pane:last-child { border-right: none; }
.vm-root {
  position: absolute; inset: 0;
  background: #f5f5f8;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  padding: 24px;
}
.k-counter {
  font-size: 64px;
  font-weight: bold;
  color: #223;
  letter-spacing: -2px;
  user-select: none;
}
.k-colorbox {
  width: 180px;
  height: 180px;
  border-radius: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: bold;
  color: rgba(255,255,255,0.85);
  text-shadow: 0 1px 3px rgba(0,0,0,0.4);
  background: #ccc;
  transition: transform 0.08s, background 0.3s;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.k-colorbox:active { transform: scale(0.95); }
.k-label {
  font-size: 11px;
  color: #889;
  letter-spacing: 1px;
}
</style>
</head>
<body>
<div id="stage">
  <div id="header">
    <h1>Krestianify — Color Demo</h1>
    <span class="hint">Click the box → deterministic random() → shared color</span>
    <span class="hint" style="margin-left:auto">Two peers · same reflector</span>
  </div>
  <div id="vms">
    <div class="vm-pane"><div id="vmA-root" class="vm-root"></div></div>
    <div class="vm-pane"><div id="vmB-root" class="vm-root"></div></div>
  </div>
</div>



<script type="module">
import { selo } from '../index.js';


// ═══════════════════════════════════════════════════════════════════════════
// THE USER'S RENKON PROGRAM
// ═══════════════════════════════════════════════════════════════════════════

const APP = `
const click   = Events.listener(Renkon.app.rootEl.querySelector(".k-colorbox"), "click", () => 1);

const counter = Behaviors.collect(0, click, (prev, _) => prev + 1);

const color = Behaviors.collect("#cccccc", click, (_, __) => {
    var r = random();
    var g = random();
    var b = random();
    return "hsl(" + Math.floor(r * 360) + "," +
           (40 + Math.floor(g * 50)) + "%," +
           (40 + Math.floor(b * 20)) + "%)";
});

const _renderCounter = Behaviors.collect(null, counter, (_, n) => {
    Renkon.app.rootEl.querySelector(".k-counter").textContent = n;
    return null;
});

const _renderColor = Behaviors.collect(null, color, (_, c) => {
    Renkon.app.rootEl.querySelector(".k-colorbox").style.background = c;
    return null;
});
`;

const MODEL_NODES = ['counter', 'color'];

// ═══════════════════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════════════════


const buildUI = (rootEl, label) => {
    rootEl.innerHTML = `
        <div class="k-label">${label}</div>
        <div class="k-counter">0</div>
        <div class="k-colorbox">click me</div>
    `;
};
selo({ app: APP, modelNodes: MODEL_NODES, seloId: 'kfy-color', reflector: 'ws://localhost:3000', rootEl: document.getElementById('vmA-root'), label: 'peer A', delay: 0,   buildUI });
selo({ app: APP, modelNodes: MODEL_NODES, seloId: 'kfy-color', reflector: 'ws://localhost:3000', rootEl: document.getElementById('vmB-root'), label: 'peer B', delay: 350, buildUI });

</script>
</body>
</html>
