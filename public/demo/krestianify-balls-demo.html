<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Krestianify — Balls Demo</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #111; font-family: monospace; }
#stage { width: 100%; height: 100dvh; display: flex; flex-direction: column; }
#header {
  flex: 0 0 auto; padding: 8px 16px;
  background: #1a1a2e; color: #aef; font-size: 13px;
  border-bottom: 1px solid #333;
  display: flex; align-items: center; gap: 16px;
}
#header h1 { color: #cdf; }
.hint { font-size: 11px; color: #556; }
#vms { flex: 1; display: flex; min-height: 0; }
.vm-pane { flex: 1; border-right: 1px solid #333; position: relative; overflow: hidden; }
.vm-pane:last-child { border-right: none; }
.vm-root { position: absolute; inset: 0; overflow: hidden; background: #0d0d1a; cursor: crosshair; touch-action: none; -webkit-user-select: none; }
.k-label { position: absolute; top: 8px; left: 12px; font-size: 11px; color: #334; letter-spacing: 1px; pointer-events: none; z-index: 1; }
.k-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="stage">
  <div id="header">
    <h1>Krestianify — Balls Demo</h1>
    <span class="hint">Click → spawn ball → auto-expires via <code>future(now(), 3000, 'expire', {id})</code> from inside Behaviors.collect</span>
    <span class="hint" style="margin-left:auto">Two peers · same reflector</span>
  </div>
  <div id="vms">
    <div class="vm-pane"><div id="vmA-root" class="vm-root"></div></div>
    <div class="vm-pane"><div id="vmB-root" class="vm-root"></div></div>
  </div>
</div>



<script type="module">
import { selo } from '../index.js';


// ═══════════════════════════════════════════════════════════════════════════
// USER PROGRAM
//
// MODEL_NODES = ['balls', 'expire']
//
// • click  — view event, auto-wired to model by krestianify
// • expire — model event, delivered by future() back into model
// • balls  — model state: array of {id, x, y, r, color, spawnedAt}
//            spawnedAt = now() (virtual time) — deterministic on all peers
//
// Demonstrates: future(now(), 3000, 'expire', ...) called from INSIDE
// a Behaviors.collect accumulator — previously broken, now supported.
// ═══════════════════════════════════════════════════════════════════════════

const APP = `
// ── MODEL ─────────────────────────────────────────────────────────────────

const _tick = Events.receiver();

const balls = Behaviors.collect([], Events.or(click, _tick), (prev, ev) => {
    if (!ev) return prev;

    // Tick: move, fade, remove if fade <= 0, chain next tick
    if (ev.type === '_tick') {
        var alive = prev.map(function(b) {
            var nx = b.x + b.vx, ny = b.y + b.vy;
            var vx = b.vx, vy = b.vy;
            if (nx - b.r < 0 || nx + b.r > 800) { vx = -vx; nx = b.x + vx; }
            if (ny - b.r < 0 || ny + b.r > 600) { vy = -vy; ny = b.y + vy; }
            return Object.assign({}, b, { x: nx, y: ny, vx: vx, vy: vy, fade: b.fade - 0.033 });
        }).filter(function(b) { return b.fade > 0; });
        if (alive.length > 0) future(now(), 50, '_tick', { type: '_tick' });
        return alive;
    }

    // Click: spawn new ball with fade=1.0
    var id    = Math.floor(random() * 1e9);
    var hue   = Math.floor(random() * 360);
    var r     = 18 + Math.floor(random() * 24);
    var speed = 1.5 + random() * 3.5;
    var angle = random() * Math.PI * 2;
    var vx    = Math.cos(angle) * speed + (random() - 0.5) * 2;
    var vy    = Math.sin(angle) * speed + (random() - 0.5) * 2;
    future(now(), 50, '_tick', { type: '_tick' });
    return prev.concat({ id: id, x: ev.x, y: ev.y, r: r,
        color: 'hsl(' + hue + ',90%,50%)', vx: vx, vy: vy, fade: 1.0 });
});

// ── VIEW ──────────────────────────────────────────────────────────────────

// Inject app-specific styles once — travels in snapshot so portal windows
// get the correct dark background and canvas sizing automatically.
const _injectAppStyles = Behaviors.collect(false, Events.timer(100), function(done, _) {
    if (done) return true;
    var styleId = 'k-balls-styles';
    if (!document.getElementById(styleId)) {
        var s = document.createElement('style');
        s.id = styleId;
        s.textContent =
            '.k-canvas{position:absolute;inset:0;width:100%;height:100%;}' +
            '.k-label{position:absolute;top:4px;left:8px;font-size:11px;' +
            'color:#aef;font-family:monospace;pointer-events:none;z-index:2;}';
        document.head.appendChild(s);
    }
    var _bg = (rootEl && rootEl.parentElement &&
               rootEl.parentElement.querySelector('.vm-label'))
              ? rootEl.parentElement : rootEl;
    if (_bg) _bg.style.background = '#0d0d1a';
    return true;
});

const _touchTap = Events.listener(rootEl, 'touchstart', (e) => {
    if (e.cancelable) e.preventDefault();
    rootEl._lastTouch = Date.now();
    var rect = rootEl.getBoundingClientRect();
    var t = e.touches[0];
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
});
const _mouseClick = Events.listener(rootEl, 'click', (e) => {
    if (rootEl._lastTouch && Date.now() - rootEl._lastTouch < 500) return null;
    var rect = rootEl.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
});
const click = Events.or(_touchTap, _mouseClick);

// Wall-clock ticker at ~60fps for smooth animation
const _frame = Events.timer(16);

// Draw — view just reads ball.fade directly from model
const _render = Behaviors.collect(null, Events.or(Events.change(balls), _frame), (_, __) => {
    var canvas = rootEl.querySelector('.k-canvas');
    if (!canvas) return null;
    var bs  = balls || [];
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width = canvas.offsetWidth, canvas.height = canvas.offsetHeight);
    bs.forEach(function(b) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, b.fade);
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 18;
        ctx.fill();
        ctx.restore();
    });
    return null;
});
`;

const MODEL_NODES = ['balls', '_tick'];

// ═══════════════════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════════════════


const buildUI = (rootEl, label) => {
    rootEl.innerHTML = `
        <div class="k-label">${label}</div>
        <canvas class="k-canvas"></canvas>
    `;
};
selo({ app: APP, modelNodes: MODEL_NODES, seloId: 'kfy-balls', reflector: 'ws://localhost:3000', rootEl: document.getElementById('vmA-root'), label: 'peer A', delay: 0,   buildUI });
selo({ app: APP, modelNodes: MODEL_NODES, seloId: 'kfy-balls', reflector: 'ws://localhost:3000', rootEl: document.getElementById('vmB-root'), label: 'peer B', delay: 350, buildUI });

</script>
</body>
</html>
